"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$time\
[](fg:color_blue bg:color_bg3)\
$cmd_duration\
[](fg:color_bg3 bg:color_bg1)\
$character\
$status\
[ ](fg:color_bg1)\
$line_break\
[  ](bold fg:color_green)"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
# アイコンにもboldをかけてターミナルの縮小描画を防ぐ
style = "bold bg:color_orange fg:color_fg0"

[os.symbols]
Windows = " "
Ubuntu = " "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[username]
show_always = true
style_user = "bold bg:color_orange fg:color_fg0"
style_root = "bold bg:color_orange fg:color_fg0"
format = '[$user ]($style)'

[directory]
style = "bold fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bold bg:color_aqua fg:color_fg0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold bg:color_aqua fg:color_fg0"
format = '[($all_status$ahead_behind )]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold bg:color_blue fg:color_fg0"
format = '[  $time ]($style)'

[cmd_duration]
disabled = false
style = "bold bg:color_bg3 fg:color_fg0"
format = '[  $duration ]($style)'
min_time = 2000

[character]
disabled = false
format = "$symbol"
success_symbol = '[ ✓  ](bold fg:color_green bg:color_bg1)'
error_symbol = '[ ✗ ](bold fg:color_red bg:color_bg1)'

[status]
disabled = false
style = "bg:color_bg1"
format = '[$int ](bold fg:color_red $style)'

[line_break]
disabled = false
