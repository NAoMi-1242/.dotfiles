# =====================================================================
# 基本設定・操作性（General & Mouse）
# =====================================================================
# マウス操作を有効化（スクロール、ペイン選択、リサイズなど）
set -g mouse on

# 修飾キー付き矢印キー（Ctrl+矢印、Ctrl+Shift+矢印など）を
# tmuxが個別のキーとして認識できるようにする
set -g xterm-keys on

# =====================================================================
# ステータスバーの見た目カスタマイズ
# =====================================================================

# 1. 左側のセッション名表示エリアの幅を拡張（デフォルト10から40へ）
set -g status-left-length 40

# 2. ステータスバー全体の背景色と文字色（Gruvbox dark等に馴染む渋めの色）
set -g status-style "bg=#3c3836,fg=#a89984"

# 3. 非アクティブ（選択していない）ウィンドウの表示
# 控えめなグレー背景に、前後関係を示すフラグ（-, * など）を表示
set-window-option -g window-status-style "bg=#3c3836,fg=#a89984"
set-window-option -g window-status-format " #I:#W#F "

# 4. アクティブ（現在選択中）ウィンドウの表示
# 鮮やかなオレンジ（または黄色）系の背景に、文字を黒にして一目でわかるように反転
set-window-option -g window-status-current-style "bg=#fe8019,fg=#1d2021,bold"
set-window-option -g window-status-current-format " #I:#W#F "

# =====================================================================
# Wezterm ズーム連動設定（ローカル・リモート共通）
# =====================================================================
set -g allow-passthrough on

set-hook -g after-resize-pane 'run-shell "
    if [ #{window_zoomed_flag} -eq 1 ]; then
        printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=TMUX_ZOOM=MQ==\\007\\033\\\\\\\\\" > #{pane_tty};
    else
        printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=TMUX_ZOOM=MA==\\007\\033\\\\\\\\\" > #{pane_tty};
    fi
"'


# =====================================================================
# Vim風 コピーモード & クリップボード同期設定
# =====================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# マウスドラッグを離したときに、自動でコピーモードを終了（選択解除）しないようにする
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- ドラッグ判定のしきい値を緩和（誤ってコピーモードに入るのを抑制） ---
unbind-key -T root MouseDown1Pane
bind-key -T root MouseDown1Pane {
    select-pane -t=
    set-option -gF @drag_sx "#{mouse_x}"
    set-option -gF @drag_sy "#{mouse_y}"
    send-keys -M
}

unbind-key -T root MouseDrag1Pane
bind-key -T root MouseDrag1Pane {
    if -Ft= "#{mouse_any_flag}" {
        if -Ft= "#{pane_in_mode}" { copy-mode -M } { send-keys -M }
    } {
        # 末尾の「4」で２セル、「9」で３セルに変更できる
        if -Ft= "#{>=:#{e|+:#{e|*:#{e|-:#{mouse_x},#{@drag_sx}},#{e|-:#{mouse_x},#{@drag_sx}}},#{e|*:#{e|-:#{mouse_y},#{@drag_sy}},#{e|-:#{mouse_y},#{@drag_sy}}}},4}" {
            copy-mode -M
        } {
            select-pane -t=
        }
    }
}

# Ctrl+C でも y と同様にコピーしてコピーモードを終了できるようにする
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "printf '\\033Ptmux;\\033\\033]52;c;%s\\007\\033\\\\' \$(base64 | tr -d '\\n') > #{pane_tty}"

# .tmux.conf内で正常に解釈されるようにエスケープを修正（$ を $$ に、\ を \\ に）
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "printf '\\033Ptmux;\\033\\033]52;c;%s\\007\\033\\\\' \$(base64 | tr -d '\\n') > #{pane_tty}"


# =====================================================================
# Wezterm互換：プレフィックスなしの直接キーバインド (Ctrl + Shift + Alt + キー)
# =====================================================================
# Ctrl + Shift + Alt + | でペインを左右に分割 (WezTermからは Ctrl+Alt+\ として届くため修正)
bind-key -n 'C-M-\' split-window -h -c "#{pane_current_path}"

# Ctrl + Shift + Alt + _ でペインを上下に分割 (WezTermからは Ctrl+Alt+_ として届く)
bind-key -n C-M-_ split-window -v -c "#{pane_current_path}"

# Ctrl + Shift + Alt + Z でペインのズーム状態を切り替える
bind-key -n C-M-Z resize-pane -Z

# Ctrl + Shift + Alt + X で現在のペインを終了する
bind-key -n C-M-X confirm-before -p "kill-pane? (y/n)" kill-pane

# Ctrl + Shift + Alt + hjkl : リモートのtmuxでペイン移動
bind-key -n C-M-H select-pane -L
bind-key -n C-M-J select-pane -D
bind-key -n C-M-K select-pane -U
bind-key -n C-M-L select-pane -R

# Ctrl + Shift + Alt + 矢印キー : リモートのtmuxでペインをリサイズ
bind-key -n C-M-S-Left  resize-pane -L 5
bind-key -n C-M-S-Right resize-pane -R 5
bind-key -n C-M-S-Up    resize-pane -U 5
bind-key -n C-M-S-Down  resize-pane -D 5

# Ctrl + Shift + Alt + T で新規ウィンドウを作成
bind-key -n C-M-T new-window -c "#{pane_current_path}"

# Ctrl + Shift + Alt + 0~9 で指定したウィンドウ番号にダイレクト移動
bind-key -n 'C-M-0' select-window -t :0
bind-key -n 'C-M-S-0' select-window -t :0
bind-key -n 'C-M-1' select-window -t :1
bind-key -n 'C-M-S-1' select-window -t :1
bind-key -n 'C-M-2' select-window -t :2
bind-key -n 'C-M-S-2' select-window -t :2
bind-key -n 'C-M-3' select-window -t :3
bind-key -n 'C-M-S-3' select-window -t :3
bind-key -n 'C-M-4' select-window -t :4
bind-key -n 'C-M-S-4' select-window -t :4
bind-key -n 'C-M-5' select-window -t :5
bind-key -n 'C-M-S-5' select-window -t :5
bind-key -n 'C-M-6' select-window -t :6
bind-key -n 'C-M-S-6' select-window -t :6
bind-key -n 'C-M-7' select-window -t :7
bind-key -n 'C-M-S-7' select-window -t :7
bind-key -n 'C-M-8' select-window -t :8
bind-key -n 'C-M-S-8' select-window -t :8
bind-key -n 'C-M-9' select-window -t :9
bind-key -n 'C-M-S-9' select-window -t :9


# Ctrl + Shift + Alt + D : tmuxセッションからデタッチ
bind-key -n C-M-D detach-client
