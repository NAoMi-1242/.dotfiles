# 基本操作
set -g mouse on
set -g xterm-keys on
# 端末応答のタイミング調整（初回接続時のOSC 10応答混入への対策候補）
set -sg escape-time 100
set -g automatic-rename on

# ステータスバーの外観
set -g status-position top
set -g status-interval 2
set -g status on
set -g status-left-length 40
set -g status-right-length 200
set -g status-style "bg=#3c3836,fg=#a89984"
set -g status-justify left

# ウィンドウ一覧（選択中はオレンジ）
set-window-option -g window-status-style "bg=#3c3836,fg=#a89984"
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-style "bg=#fe8019,fg=#1d2021,bold"
set-window-option -g window-status-current-format " #I:#W "
set -g status-left " #H [#S] "

# ハードウェア情報（GPU取得不可ならCPU/MEMのみ）
set -g status-right "#[fg=#fabd2f]CPU #(LC_ALL=C top -bn1 2>/dev/null | awk '/Cpu\\(s\\)/ {printf \"%.0f%%%%\", 100 - \$8; exit}') #[fg=#83a598]MEM #(free -b 2>/dev/null | awk '/^Mem:/ {printf \"%.1f/%.1fGB\", \$3/1000000000, \$2/1000000000; exit}')#(nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader,nounits 2>/dev/null | awk -F, '{gsub(/^[ \\t]+|[ \\t]+$/, \"\", \$1); gsub(/^[ \\t]+|[ \\t]+$/, \"\", \$2); gsub(/^[ \\t]+|[ \\t]+$/, \"\", \$3); gsub(/^[ \\t]+|[ \\t]+$/, \"\", \$4); if (\$1 ~ /^[0-9]+$/ && \$2 ~ /^[0-9]+$/ && \$3 ~ /^[0-9]+$/ && \$4 ~ /^[0-9]+$/) {gpu+=\$1; used+=\$2; total+=\$3; if (\$4>temp) temp=\$4; n++}} END {if(n>0) printf \" #[fg=#b8bb26]GPU %.0f%%%% #[fg=#8ec07c]VRAM %.1f/%.1fGB #[fg=#fb4934]TEMP %d°C\", gpu/n, used/1024, total/1024, temp}')#[default]"

# 1段・2段のレイアウト（選択中のウィンドウはオレンジ）
set -g @status-line-one '#{E:status-left}#{W:#[range=window|#{window_index}]#[fg=#a89984] #I:#W #[norange],#[range=window|#{window_index}]#[bg=#fe8019]#[fg=#1d2021]#[bold] #I:#W #[default]#[norange]}#[align=right]#{E:status-right}'
set -g @status-line-two '#{E:status-left}#{W:#[range=window|#{window_index}]#[fg=#a89984] #I:#W #[norange],#[range=window|#{window_index}]#[bg=#fe8019]#[fg=#1d2021]#[bold] #I:#W #[default]#[norange]}'
set -g 'status-format[0]' '#{E:status-left}#{W:#[range=window|#{window_index}]#[fg=#a89984] #I:#W #[norange],#[range=window|#{window_index}]#[bg=#fe8019]#[fg=#1d2021]#[bold] #I:#W #[default]#[norange]}#[align=right]#{E:status-right}'
set -g 'status-format[1]' '#[align=right]#{E:status-right}'

# 接続中クライアントの幅に応じて1段/2段を自動切り替え
set -g @adaptive-shell '
for session in $(tmux list-sessions -F "#{session_id}" 2>/dev/null); do
    width=0
    clients=$(tmux list-clients -t "$session" -F "#{client_width}" 2>/dev/null)
    for w in $clients; do
        case "$w" in *[!0-9]*|"") continue;; esac
        if [ "$width" -eq 0 ] || [ "$w" -lt "$width" ]; then width=$w; fi
    done
    [ "$width" -gt 0 ] || continue
    host=$(hostname -s)
    name=$(tmux display-message -p -t "$session" "#{session_name}")
    left=$(( ${#host} + ${#name} + 5 ))
    windows=0
    items=$(tmux list-windows -t "$session" -F "#{window_index}:#{window_name}" 2>/dev/null)
    while IFS= read -r item; do
        [ -n "$item" ] || continue
        n=$(printf "%s" "$item" | wc -m)
        windows=$((windows + n + 2))
    done <<EOF_WINDOWS
$items
EOF_WINDOWS
    right=26
    if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
        right=$((right + 39))
    fi
    needed=$((left + windows + right + 2))
    if [ "$needed" -gt "$width" ]; then
        desired=2
        layout=$(tmux show-options -gqv @status-line-two)
    else
        desired=on
        layout=$(tmux show-options -gqv @status-line-one)
    fi
    tmux set-option -q -t "$session" "status-format[1]" "#[align=right]#{E:status-right}"
    old=$(tmux show-options -qv -t "$session" "status-format[0]")
    [ "$old" = "$layout" ] || tmux set-option -t "$session" "status-format[0]" "$layout"
    current=$(tmux show-options -qv -t "$session" status)
    [ "$current" = "$desired" ] || tmux set-option -t "$session" status "$desired"
done
'

# 画面幅・ウィンドウ変更時に再判定
set-hook -g client-resized 'run-shell -b "#{@adaptive-shell}"'
set-hook -g client-attached 'run-shell -b "#{@adaptive-shell}"'
set-hook -g client-detached 'run-shell -b "#{@adaptive-shell}"'
set-hook -g window-linked 'run-shell -b "#{@adaptive-shell}"'
set-hook -g window-unlinked 'run-shell -b "#{@adaptive-shell}"'
set-hook -g window-renamed 'run-shell -b "#{@adaptive-shell}"'
run-shell -b '#{@adaptive-shell}'

# WezTermのズーム状態を同期
set -g allow-passthrough on

set-hook -g after-resize-pane 'run-shell "
    if [ #{window_zoomed_flag} -eq 1 ]; then
        printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=TMUX_ZOOM=MQ==\\007\\033\\\\\\\\\" > #{pane_tty};
    else
        printf \"\\033Ptmux;\\033\\033]1337;SetUserVar=TMUX_ZOOM=MA==\\007\\033\\\\\\\\\" > #{pane_tty};
    fi
"'


# ステータスバーのウィンドウをクリックして切り替え
# tmuxのマウス位置から対象ウィンドウを判定
bind-key -T root MouseDown1Status select-window -t =

# コピー操作とマウス選択
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# ドラッグ距離に応じて選択モードへ移行
unbind-key -T root MouseDown1Pane
bind-key -T root MouseDown1Pane {
    select-pane -t=
    set-option -gF @drag_sx "#{mouse_x}"
    set-option -gF @drag_sy "#{mouse_y}"
    send-keys -M
}

unbind-key -T root MouseDrag1Pane
bind-key -T root MouseDrag1Pane {
    if -Ft= "#{mouse_any_flag}" {
        if -Ft= "#{pane_in_mode}" { copy-mode -M } { send-keys -M }
    } {
        if -Ft= "#{>=:#{e|+:#{e|*:#{e|-:#{mouse_x},#{@drag_sx}},#{e|-:#{mouse_x},#{@drag_sx}}},#{e|*:#{e|-:#{mouse_y},#{@drag_sy}},#{e|-:#{mouse_y},#{@drag_sy}}}},4}" {
            copy-mode -M
        } {
            select-pane -t=
        }
    }
}

bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "printf '\\033Ptmux;\\033\\033]52;c;%s\\007\\033\\\\' \$(base64 | tr -d '\\n') > #{pane_tty}"

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "printf '\\033Ptmux;\\033\\033]52;c;%s\\007\\033\\\\' \$(base64 | tr -d '\\n') > #{pane_tty}"


# Ctrl+Altによるtmux操作
bind-key -n 'C-M-\' split-window -h -c "#{pane_current_path}"

bind-key -n C-M-_ split-window -v -c "#{pane_current_path}"

bind-key -n C-M-z resize-pane -Z

bind-key -n C-M-x confirm-before -p "kill-pane? (y/n)" kill-pane

bind-key -n C-M-w confirm-before -p "kill-window? (y/n)" kill-window

bind-key -n C-M-s choose-tree -Zs

bind-key -n C-M-h select-pane -L
bind-key -n C-M-j select-pane -D
bind-key -n C-M-k select-pane -U
bind-key -n C-M-l select-pane -R

bind-key -n C-M-Left  resize-pane -L 5
bind-key -n C-M-Right resize-pane -R 5
bind-key -n C-M-Up    resize-pane -U 5
bind-key -n C-M-Down  resize-pane -D 5

bind-key -n C-M-t new-window -c "#{pane_current_path}"

bind-key -n C-M-d detach-client
